<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向C：学习仪表盘（资产总览优先）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,"PingFang SC",sans-serif; }
  body { background:#f5f5f5; color:#333; height:100vh; display:flex; flex-direction:column; }
  header { background:#fff; border-bottom:2px solid #999; padding:10px 16px; display:flex; align-items:center; gap:10px; }
  .logo { font-weight:700; border:2px solid #333; padding:2px 10px; }
  .capsule { border:2px dashed #666; border-radius:16px; padding:4px 12px; font-size:12px; cursor:pointer; }
  main { flex:1; display:grid; grid-template-columns:1fr 340px; grid-template-rows:1fr auto; gap:8px; padding:8px; min-height:0; }
  .pane { border:2px solid #999; background:#fff; padding:12px; position:relative; overflow:hidden; }
  .pane h3 { font-size:13px; border-bottom:1px dashed #999; padding-bottom:6px; margin-bottom:8px; }
  .wire { border:2px dashed #aaa; border-radius:8px; padding:10px; margin:8px 0; font-size:12px; color:#666; background:#fafafa; }
  .node { display:inline-block; border:2px solid #666; border-radius:50%; width:52px; height:52px; line-height:50px; text-align:center; font-size:10px; margin:8px; background:#fff; }
  .tag { position:absolute; font-size:11px; color:#fff; background:#333; padding:2px 8px; border-radius:8px; }
  .chatbar { grid-column:1/3; border:2px solid #333; background:#fff; border-radius:12px; padding:10px; display:flex; gap:8px; align-items:center; }
  .chatbar .box { flex:1; border:2px dashed #888; border-radius:8px; padding:10px; font-size:13px; color:#999; }
  .chatbar .btn { border:2px solid #333; border-radius:8px; padding:10px 18px; font-weight:700; font-size:13px; }
</style>
</head>
<body>
<header>
  <span class="logo">织识</span>
  <span style="flex:1"></span>
  <span class="capsule" onclick="document.getElementById('pop').style.display='block'">👤</span>
</header>
<main>
  <div class="pane">
    <h3>🕸️ 知识图谱（首屏大图 = 你的产品名片）</h3>
    <div class="tag" style="top:8px;right:8px">一打开就证明"它记得我"</div>
    <div style="text-align:center;padding:30px 0">
      <span class="node">RAG</span><span class="node">向量检索</span><span class="node">Attention</span><br>
      <span class="node">回归测试</span><span class="node">冒烟测试</span><span class="node">灰度发布</span>
    </div>
    <div class="wire">按掌握度着色；标出"快忘了"的节点（S7 周末回顾就在这发生）</div>
  </div>
  <div class="pane">
    <h3>📥 待学习（常驻侧栏，直接可见）</h3>
    <div class="wire">RAG调优文章 [学] [听]</div>
    <div class="wire">截图 11-07 [学] [听]</div>
    <div class="wire" style="border-style:solid;color:#333">⚠️ 2 篇存了 5 天没学（防吃灰提醒）</div>
    <h3 style="margin-top:14px">💬 最近对话</h3>
    <div class="wire">"回归测试是啥" → 已出卡</div>
    <div class="wire">"考考我" → 掌握度↑</div>
  </div>
  <div class="chatbar">
    <div class="box">输入框常驻底部：提问 / 贴链接 / 拖文件——说完产出以卡片形式插到左侧</div>
    <div class="btn">发送</div>
  </div>
</main>
<div id="pop" style="display:none;position:fixed;top:60px;right:16px;width:320px;background:#fff;border:3px solid #333;z-index:11;padding:16px;border-radius:12px">
  <b>👤 它眼中的你</b>
  <div class="wire" style="margin-top:8px">画像 + AI 总结 + [✏️ 修改]</div>
  <button onclick="this.parentElement.style.display='none'" style="margin-top:8px;padding:6px 14px">关闭</button>
</div>
</body>
</html>
