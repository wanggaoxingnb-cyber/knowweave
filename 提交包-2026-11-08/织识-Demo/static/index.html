<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>织识 KnowWeave</title>
<script src="/static/vendor/vis-network.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC",sans-serif; background:#0f1420; color:#e8eaf0; height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { padding:10px 20px; border-bottom:1px solid #232b3d; display:flex; align-items:center; gap:12px; }
  header h1 { font-size:18px; color:#7ec8ff; }
  header .tagline { font-size:12px; color:#8a93a8; flex:1; }
  header button { background:#2c3650; color:#e8eaf0; border:none; border-radius:8px; padding:7px 14px; font-size:13px; cursor:pointer; }
  header button:hover { background:#3b82f6; }
  main { flex:1; display:grid; grid-template-columns:minmax(340px,42%) 5px 1fr; grid-template-rows:minmax(0,1fr); min-height:0; }
  main > * { min-height:0; }
  .divider { background:#232b3d; cursor:col-resize; }
  .divider:hover { background:#3b82f6; }

  /* 左：对话区（主场） */
  #chatPane { display:flex; flex-direction:column; }
  #chatLog { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 14px; border-radius:12px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:#3b82f6; color:#fff; }
  .msg.bot { align-self:flex-start; background:#1a2235; border:1px solid #2c3650; }
  .msg.sys { align-self:center; background:none; color:#8a93a8; font-size:12px; }
  .msg.ref { align-self:flex-start; background:#131a29; border:1px dashed #3b82f6; font-size:13px; color:#aab3c8; }
  .msg.ref b { color:#7ec8ff; }
  .msg.ref .mini-btn { margin:0 0 0 8px; }
  #inputBar { padding:12px; border-top:1px solid #232b3d; }
  #inputWrap { display:flex; gap:8px; align-items:flex-end; background:#171e2e; border:1px solid #2c3650; border-radius:12px; padding:8px; }
  #inputWrap.dragover { border-color:#7ec8ff; background:#1a2a4a; }
  #chatInput { flex:1; background:none; border:none; color:#e8eaf0; font-size:14px; resize:none; outline:none; max-height:120px; font-family:inherit; }
  #chatInput::placeholder { color:#556; }
  .iconBtn { background:none; border:none; font-size:18px; cursor:pointer; padding:4px 6px; color:#8a93a8; }
  .iconBtn:hover { color:#7ec8ff; }
  #sendBtn { background:#3b82f6; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  #fileChips { display:flex; flex-wrap:wrap; gap:6px; padding:0 4px 6px; }
  .fchip { background:#1d3a2a; color:#7ee2a8; border-radius:6px; padding:2px 8px; font-size:12px; }

  /* 右：舞台区（重产出） */
  #stagePane { display:flex; flex-direction:column; border-left:1px solid #232b3d; }
  #stageTabs { display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px; border-bottom:1px solid #232b3d; align-items:center; }
  #stageTabs .tablabel { font-size:12px; color:#8a93a8; margin-right:2px; }
  .stab { background:#1a2235; border:1px solid #2c3650; color:#aab3c8; border-radius:999px; padding:4px 12px; font-size:12px; cursor:pointer; max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stab:hover { border-color:#3b82f6; color:#e8eaf0; }
  .stab.active { background:#3b82f6; border-color:#3b82f6; color:#fff; }
  #stage { flex:1; overflow-y:auto; padding:16px; }
  #stageEmpty { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:#8a93a8; }
  #stageEmpty .big { font-size:40px; }
  #stageEmpty p { font-size:13px; }
  .suggest { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:520px; }
  .suggest button { background:#1a2235; border:1px solid #2c3650; color:#7ec8ff; border-radius:999px; padding:7px 14px; font-size:13px; cursor:pointer; }
  .suggest button:hover { border-color:#3b82f6; background:#1a2a4a; }

  .card { background:#171e2e; border:1px solid #2c3650; border-radius:12px; padding:18px; margin-bottom:14px; }
  .card h3 { color:#7ec8ff; font-size:17px; margin-bottom:8px; }
  .card .section { margin-top:10px; font-size:14px; line-height:1.75; }
  .label { color:#f5b942; font-weight:600; }
  .warning { background:#3a2a1a; border:1px solid #f5b942; border-radius:8px; padding:8px 12px; margin-top:10px; font-size:13px; }
  .learned { display:inline-block; background:#1d3a2a; color:#7ee2a8; border-radius:6px; padding:2px 8px; margin:2px; font-size:12px; }
  .events { font-size:12px; color:#8a93a8; margin-top:10px; }
  audio { width:100%; margin-top:10px; }
  .walk-item { font-size:13.5px; line-height:1.7; margin-top:10px; }
  .walk-item b { color:#7ec8ff; }
  .quiz-item { background:#131a29; border:1px solid #2c3650; border-radius:8px; padding:12px; margin-top:10px; }
  .quiz-item .q { font-size:13.5px; color:#7ec8ff; margin-bottom:8px; }
  .quiz-item input { width:100%; background:#0f1420; color:#e8eaf0; border:1px solid #2c3650; border-radius:6px; padding:8px; font-size:13px; }
  .quiz-item .fb { font-size:13px; margin-top:8px; line-height:1.65; }
  .quiz-item .fb.pass { color:#7ee2a8; } .quiz-item .fb.fail { color:#f5b942; }
  .mini-btn { background:#2c3650; color:#e8eaf0; border:none; border-radius:7px; padding:5px 12px; font-size:12px; cursor:pointer; margin-top:8px; }
  .mini-btn:hover { background:#3b82f6; }
  .path-step { border-left:3px solid #3b82f6; padding:8px 0 8px 14px; margin:10px 0; }
  .path-step b { color:#7ec8ff; }
  .inbox-item { background:#171e2e; border:1px solid #2c3650; border-radius:10px; padding:14px; margin-bottom:10px; }
  .inbox-item b { color:#7ec8ff; }
  .inbox-item .hook { font-size:13px; color:#8a93a8; margin:6px 0; }
  iframe.viz { width:100%; height:calc(100vh - 220px); min-height:420px; border:1px solid #2c3650; border-radius:12px; background:#0f1420; }
  pre.article { white-space:pre-wrap; font-family:inherit; font-size:13.5px; line-height:1.8; }

  /* 待学习抽屉（右侧滑出，不顶舞台） */
  #inboxDrawer { position:fixed; top:0; right:0; width:380px; max-width:92vw; height:100vh; background:#131a29; border-left:1px solid #2c3650; z-index:60; transform:translateX(105%); transition:transform .25s ease; display:flex; flex-direction:column; box-shadow:-12px 0 32px rgba(0,0,0,.45); }
  #inboxDrawer.open { transform:translateX(0); }
  #inboxDrawer .dhead { padding:14px 16px; border-bottom:1px solid #232b3d; display:flex; align-items:center; gap:10px; }
  #inboxDrawer .dhead b { color:#7ec8ff; font-size:15px; flex:1; }
  #inboxDrawer .dbody { flex:1; overflow-y:auto; padding:14px; }
  .x-btn { background:none; border:none; color:#8a93a8; font-size:18px; cursor:pointer; padding:2px 6px; }
  .x-btn:hover { color:#fff; }

  /* 图谱全屏覆盖层 */
  #graphOverlay { position:fixed; inset:0; background:#0f1420; z-index:70; display:none; flex-direction:column; }
  #graphOverlay.open { display:flex; }
  #graphOverlay .ghead { padding:10px 18px; border-bottom:1px solid #232b3d; display:flex; align-items:center; gap:12px; }
  #graphOverlay .ghead b { color:#7ec8ff; font-size:15px; }
  #graphLegend { display:flex; flex-wrap:wrap; gap:10px; font-size:12px; color:#8a93a8; flex:1; }
  #graphLegend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
  #graphWrap { flex:1; position:relative; min-height:0; }
  #graph { position:absolute; inset:0; }
  #graphDetail { position:absolute; top:16px; right:16px; width:380px; max-width:88vw; max-height:calc(100% - 32px); overflow-y:auto; background:#131a29; border:1px solid #3b82f6; border-radius:14px; padding:18px; display:none; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  #graphDetail h3 { color:#7ec8ff; margin-bottom:8px; }
  #graphDetail .body { font-size:13.5px; line-height:1.75; white-space:pre-wrap; margin-top:10px; color:#cfd6e4; }

  /* 画像弹层 */
  #profileOverlay { position:fixed; inset:0; background:rgba(8,10,16,.6); z-index:80; display:none; align-items:center; justify-content:center; }
  #profileOverlay.open { display:flex; }
  #profileModal { width:560px; max-width:92vw; max-height:82vh; background:#131a29; border:1px solid #2c3650; border-radius:14px; display:flex; flex-direction:column; overflow:hidden; }
  #profileModal .phead { padding:14px 18px; border-bottom:1px solid #232b3d; display:flex; align-items:center; gap:10px; }
  #profileModal .phead b { color:#7ec8ff; font-size:15px; flex:1; }
  #profileBody { flex:1; overflow-y:auto; padding:16px 18px; font-size:13.5px; line-height:1.8; white-space:pre-wrap; color:#cfd6e4; }
  #profileBody .sigline { color:#7ee2a8; }
  #profileBody .hint { color:#556; font-size:12px; margin-top:12px; }
  #profileEdit { flex:1; background:#0f1420; color:#e8eaf0; border:none; padding:16px 18px; font-size:13px; line-height:1.7; font-family:inherit; resize:none; outline:none; min-height:300px; display:none; }

  #status { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#3b82f6; padding:8px 18px; border-radius:999px; font-size:13px; display:none; z-index:99; box-shadow:0 6px 20px rgba(0,0,0,.4); }
</style>
</head>
<body>
<header>
  <h1>织识 KnowWeave</h1>
  <div class="tagline">记得你学过什么、也知道你是谁的 AI 学习助手</div>
  <button onclick="toggleInbox()">📥 待学习 <span id="inboxCount"></span></button>
  <button onclick="openGraph()">🕸️ 知识图谱</button>
  <button onclick="openProfile()">👤 它眼中的你</button>
</header>
<main>
  <div id="chatPane">
    <div id="chatLog">
      <div class="msg sys">把文章/链接/截图丢给我，或直接问。我会记得你学过什么。</div>
    </div>
    <div id="inputBar">
      <div id="fileChips"></div>
      <div id="inputWrap">
        <textarea id="chatInput" rows="2" placeholder="问点什么，或把资料丢给我…"></textarea>
        <button class="iconBtn" onclick="$('fileInput').click()" title="上传文件/截图">📎</button>
        <button id="sendBtn" onclick="send()">发送</button>
      </div>
      <input type="file" id="fileInput" multiple style="display:none" accept=".md,.txt,.pdf,.png,.jpg,.jpeg,.webp">
    </div>
  </div>
  <div class="divider" id="div1"></div>
  <div id="stagePane">
    <div id="stageTabs"><span class="tablabel">🎬 舞台</span></div>
    <div id="stage">
      <div id="stageEmpty">
        <div class="big">🧶</div>
        <p>概念卡 / 学习页 / 图解 / 文章会在这里展开</p>
        <div class="suggest">
          <button onclick="fillAndSend('回归测试是啥')">回归测试是啥</button>
          <button onclick="fillAndSend('我想系统学 LLM 原理')">我想系统学 LLM 原理</button>
          <button onclick="fillAndSend('Attention 太难懂了，画给我看')">Attention 画给我看</button>
          <button onclick="fillAndSend('考考我 RAG')">考考我 RAG</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="inboxDrawer">
  <div class="dhead"><b>📥 待学习区</b><button class="x-btn" onclick="toggleInbox()">✕</button></div>
  <div class="dbody" id="inboxBody">读取中…</div>
</div>

<div id="graphOverlay">
  <div class="ghead">
    <b>🕸️ 知识图谱</b>
    <div id="graphLegend">
      <span><i style="background:#2c3650"></i>新接触</span>
      <span><i style="background:#2a4a6a"></i>理解了</span>
      <span><i style="background:#1d6a4a"></i>能讲给别人</span>
      <span><i style="background:#7ee2a8"></i>能用</span>
      <span><i style="background:#f5b942"></i>本次高亮</span>
    </div>
    <button class="x-btn" onclick="closeGraph()">✕</button>
  </div>
  <div id="graphWrap">
    <div id="graph"></div>
    <div id="graphDetail"></div>
  </div>
</div>

<div id="profileOverlay" onclick="if(event.target===this)closeProfile()">
  <div id="profileModal">
    <div class="phead">
      <b>👤 它眼中的你</b>
      <button class="mini-btn" style="margin:0" id="profileEditBtn" onclick="toggleProfileEdit()">✏️ 编辑</button>
      <button class="x-btn" onclick="closeProfile()">✕</button>
    </div>
    <div id="profileBody">读取中…</div>
    <textarea id="profileEdit" spellcheck="false"></textarea>
  </div>
</div>

<div id="status"></div>

<script>
let network = null, pendingFiles = [], stageStore = [], stageSeq = 0, currentStage = -1, profileEditing = false, lastHighlight = [];
const $ = id => document.getElementById(id);
const esc = t => (t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');

function showStatus(t) { const s=$('status'); if(!t){s.style.display='none';return;} s.textContent=t; s.style.display='block'; }

/* ---------- 舞台：重产出上舞台，对话留引用卡 ---------- */
function pushStage(html, title, icon) {
  const id = ++stageSeq;
  stageStore.unshift({id, title, html, icon: icon || '📄'});
  if (stageStore.length > 12) stageStore.pop();
  renderStageTabs();
  openStage(id);
  addStageRef(id, icon || '📄', title);
}
function renderStageTabs() {
  $('stageTabs').innerHTML = '<span class="tablabel">🎬 舞台</span>' + stageStore.map(s =>
    `<button class="stab ${s.id===currentStage?'active':''}" onclick="openStage(${s.id})">${s.icon} ${esc(s.title)}</button>`).join('');
}
function openStage(id) {
  const s = stageStore.find(x => x.id === id); if (!s) return;
  currentStage = id;
  $('stage').innerHTML = s.html;
  renderStageTabs();
}
function addStageRef(id, icon, title) {
  const d = document.createElement('div');
  d.className = 'msg ref';
  d.innerHTML = `${icon} <b>${esc(title)}</b> 已在右侧舞台打开 <button class="mini-btn" onclick="openStage(${id})">重新打开</button>`;
  $('chatLog').appendChild(d); $('chatLog').scrollTop = $('chatLog').scrollHeight;
}

/* 分栏拖拽：拖分隔条调整对话/舞台宽度 */
(function () {
  const main = document.querySelector('main');
  $('div1').addEventListener('mousedown', e => {
    e.preventDefault();
    const move = ev => {
      const w = Math.max(300, Math.min(ev.clientX, innerWidth * 0.65));
      main.style.gridTemplateColumns = w + 'px 5px 1fr';
    };
    const up = () => { removeEventListener('mousemove', move); removeEventListener('mouseup', up); };
    addEventListener('mousemove', move); addEventListener('mouseup', up);
  });
})();
function addMsg(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role; d.textContent = text;
  $('chatLog').appendChild(d); $('chatLog').scrollTop = $('chatLog').scrollHeight;
}

/* ---------- 图谱（全屏覆盖层） ---------- */
async function openGraph(highlight = lastHighlight) {
  lastHighlight = [];
  $('graphOverlay').classList.add('open');
  $('graphDetail').style.display = 'none';
  const data = await (await fetch('/api/graph')).json();
  const colorByMastery = m => ({ 'initial':'#2c3650', '理解了':'#2a4a6a', '能讲给别人':'#1d6a4a', '能用':'#7ee2a8' }[m] || '#2c3650');
  const nodes = new vis.DataSet(data.nodes.map(n => ({
    id:n.id, label:n.label,
    color:{ background: highlight.includes(n.id) ? '#f5b942' : colorByMastery(n.掌握度), border:'#3b82f6' },
    font:{ color:'#e8eaf0' }, title:`掌握度: ${n.掌握度} · 更新: ${n.更新时间}`
  })));
  if (network) { network.destroy(); network = null; }
  network = new vis.Network($('graph'), {nodes, edges:new vis.DataSet(data.edges)},
    { physics:{stabilization:true}, edges:{color:'#3b82f6'} });
  network.once('stabilizationIterationsDone', () => network.fit({animation:{duration:400}}));
  setTimeout(() => network.fit(), 1500);
  network.on('click', async p => {
    if (!p.nodes.length) { $('graphDetail').style.display = 'none'; return; }
    const d = await (await fetch('/api/concept/' + encodeURIComponent(p.nodes[0]))).json();
    if (!d.error) showGraphDetail(d);
  });
}
function closeGraph() { $('graphOverlay').classList.remove('open'); }
function showGraphDetail(d) {
  const box = $('graphDetail');
  box.innerHTML = `<h3>${esc(d.name)}</h3>
    <div style="font-size:12.5px;color:#8a93a8"><span class="label">掌握度：</span>${esc(d.mastery)}　<span class="label">来源：</span>${esc(d.source)}</div>
    <div class="body">${esc(d.body)}</div>
    ${d.related.length ? `<div class="section" style="margin-top:10px">相关：${d.related.map(x=>`<span class="learned">${esc(x)}</span>`).join('')}</div>` : ''}
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="mini-btn" style="margin:0" onclick="closeGraph();fillAndSend('考考我 ${esc(d.name)}')">🎯 再考我</button>
      <button class="mini-btn" style="margin:0" onclick="closeGraph();fillAndSend('${esc(d.name)} 太难懂了，画给我看')">🎬 演绎一下</button>
    </div>`;
  box.style.display = 'block';
}

/* ---------- 它眼中的你（弹层，可编辑写回） ---------- */
async function openProfile() {
  $('profileOverlay').classList.add('open');
  profileEditing = false;
  $('profileEdit').style.display = 'none';
  $('profileBody').style.display = 'block';
  $('profileEditBtn').textContent = '✏️ 编辑';
  await loadProfileView();
}
function closeProfile() { $('profileOverlay').classList.remove('open'); }
async function loadProfileView() {
  try {
    const d = await (await fetch('/api/profile')).json();
    const lines = (d.profile || '').split('\n').filter(l => l.trim() !== '---').map(l => {
      const t = l.trim();
      if (t.startsWith('## ')) return `\n【${esc(t.slice(3))}】`;
      if (/^-\s*\[/.test(t)) return `<span class="sigline">${esc(l)}</span>`;
      return esc(l);
    }).join('\n');
    $('profileBody').innerHTML = lines + '<div class="hint">这些就是织识记住的关于你的事。点右上角「编辑」可以改，保存后立即生效。</div>';
  } catch (e) { $('profileBody').textContent = '画像读取失败'; }
}
async function toggleProfileEdit() {
  if (!profileEditing) {
    const d = await (await fetch('/api/profile')).json();
    $('profileEdit').value = d.profile || '';
    $('profileBody').style.display = 'none';
    $('profileEdit').style.display = 'block';
    $('profileEditBtn').textContent = '💾 保存';
    profileEditing = true;
  } else {
    const content = $('profileEdit').value.trim();
    if (!content) { showStatus('内容为空，没保存'); setTimeout(()=>showStatus(''),1500); return; }
    const r = await (await fetch('/api/profile', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({profile:content})})).json();
    if (r.ok) {
      showStatus('画像已更新 ✅'); setTimeout(()=>showStatus(''),1500);
      profileEditing = false;
      $('profileEdit').style.display = 'none';
      $('profileBody').style.display = 'block';
      $('profileEditBtn').textContent = '✏️ 编辑';
      await loadProfileView();
    }
  }
}

function fillAndSend(text) { $('chatInput').value = text; send(); }

/* ---------- 待学习抽屉 ---------- */
async function toggleInbox() {
  const dr = $('inboxDrawer');
  if (dr.classList.contains('open')) { dr.classList.remove('open'); return; }
  dr.classList.add('open');
  $('inboxBody').innerHTML = '读取中…';
  const d = await (await fetch('/api/inbox')).json();
  updateInboxCount(d.items);
  $('inboxBody').innerHTML = d.items.length ? d.items.map(i=>`<div class="inbox-item"><b>${esc(i['标题'])}</b>
      <div class="hook">种草点：${esc(i['种草点'])}　·　存于 ${esc(i['存入时间'])}</div>
      <button class="mini-btn" onclick="learnInbox('${esc(i._file)}')">📖 开始学</button>
      <button class="mini-btn" onclick="podcastInbox('${esc(i._file)}')">🎧 听个大概</button></div>`).join('')
    : '<div style="color:#8a93a8;font-size:13px;padding:8px">缓存区是空的。丢个链接说「先存着」试试。</div>';
}
async function podcastInbox(file) {
  toggleInbox();
  showStatus('做 60 秒播客中…');
  const d = await (await fetch('/api/inbox/podcast',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({file})})).json();
  showStatus('');
  if (d.script) {
    pushStage(`<div class="card"><h3>🎧 听个大概：${esc(d.title)}</h3>
      ${d.audio_url?`<audio controls autoplay src="${d.audio_url}"></audio>`:''}
      <div class="section" style="white-space:pre-wrap">${esc(d.script)}</div>
      <div class="events">听完想深学就回待学习区点「开始学」</div></div>`, `听个大概：${d.title}`, '🎧');
  }
  addMsg('bot', d.reply || d.error || '出了点问题');
}
async function learnInbox(file) {
  toggleInbox();
  showStatus('学习中…');
  const d = await (await fetch('/api/inbox/learn',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({file})})).json();
  showStatus('');
  if (d.pages) { renderLearn(d); updateInboxCount(d.inbox); addMsg('bot', d.reply); }
  else addMsg('bot', d.reply || d.error || '出了点问题');
}
function updateInboxCount(items) { if (items) $('inboxCount').textContent = items.length ? `(${items.length})` : ''; }

/* ---------- 考考我（答题在舞台卡里） ---------- */
let quizSeq = 0;
function quizBlock(questions, concept) {
  return (questions||[]).map(item => { const id = ++quizSeq;
    return `<div class="quiz-item"><div class="q">📝 ${esc(item.q)}</div>
      <input id="qa-${id}" placeholder="用自己的话回答…">
      <button class="mini-btn" onclick="judge(${id},'${esc(concept)}')">提交</button>
      <div class="fb" id="qf-${id}"></div>
      <input type="hidden" id="qr-${id}" value="${esc(item.a)}">
      <input type="hidden" id="qq-${id}" value="${esc(item.q)}"></div>`; }).join('');
}
async function judge(id, concept) {
  const answer = $('qa-'+id).value.trim(); if (!answer) return;
  const fb = $('qf-'+id); fb.className='fb'; fb.textContent='判题中…';
  const d = await (await fetch('/api/quiz/judge',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({concept, question:$('qq-'+id).value, reference:$('qr-'+id).value, answer})})).json();
  fb.className = 'fb ' + (d.pass ? 'pass' : 'fail');
  fb.textContent = (d.pass ? '✅ ' : '💡 ') + (d.feedback||'') + (d.mastery ? `（掌握度 → ${d.mastery}）` : '');
}
async function quizMe(btn, concept) {
  showStatus('出题中…');
  const d = await (await fetch('/api/quiz',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({concept})})).json();
  showStatus('');
  pushStage(`<div class="card"><h3>🎯 考考你：${esc(concept)}</h3>${quizBlock(d.questions, concept)}</div>`, `考考你：${concept}`, '🎯');
}

/* ---------- 产出渲染（全部上舞台） ---------- */
function renderAsk(d) {
  const c = d.card;
  pushStage(`<div class="card"><h3>${esc(c.concept)}</h3>
    <div class="section"><span class="label">大白话：</span>${esc(c.explanation)}</div>
    ${c.analogy?`<div class="section"><span class="label">举个例子（你熟的）：</span>${esc(c.analogy)}</div>`:''}
    ${c.hook?`<div class="section"><span class="label">记忆钩子：</span>${esc(c.hook)}</div>`:''}
    ${c.warning?`<div class="warning">⚠️ ${esc(c.warning)}</div>`:''}
    ${d.learned_before?.length?`<div class="section">你学过：${d.learned_before.map(x=>`<span class="learned">${esc(x)}</span>`).join('')}</div>`:''}
    ${d.audio_url?`<audio controls src="${d.audio_url}"></audio>`:''}
    <button class="mini-btn" onclick="quizMe(this,'${esc(c.concept)}')">🎯 考考我</button>
    <div class="events">${(d.memory_events||[]).join('；')}</div></div>`, c.concept, '📇');
}
function renderLearn(d) {
  pushStage((d.pages||[]).map(pg => pg.error ? `<div class="card">${esc(pg.error)}</div>` : `
    <div class="card"><h3>📖 学习页</h3>
      <div class="section"><span class="label">一句话：</span>${esc(pg.summary)}</div>
      ${(pg.walkthrough||[]).map(w=>`<div class="walk-item">▸ <b>${esc(w.heading)}</b><br>${esc(w.note)}</div>`).join('')}
      ${pg.audio_url?`<audio controls src="${pg.audio_url}"></audio>`:''}</div>
    ${(pg.cards||[]).map(c=>`<div class="card"><h3>${esc(c.name)}</h3>
      <div class="section"><span class="label">大白话：</span>${esc(c.explanation)}</div>
      ${c.analogy?`<div class="section"><span class="label">举个例子：</span>${esc(c.analogy)}</div>`:''}
      ${c.hook?`<div class="section"><span class="label">记忆钩子：</span>${esc(c.hook)}</div>`:''}</div>`).join('')}
    ${(pg.quiz||[]).length?`<div class="card"><h3>✍️ 检验一下</h3>${quizBlock(pg.quiz, pg.cards[0]?.name||'')}</div>`:''}
    <div class="events">${(pg.memory_events||[]).join('；')}</div>`).join(''), '学习页', '📖');
}
function renderMentor(d) {
  const m = d.mentor;
  pushStage(`<div class="card"><h3>🧭 攻坚路径：${esc(d.topic)}</h3>
    <div class="section"><span class="label">目标：</span>${esc(m.goal)}</div>
    ${(m.steps||[]).map((s,i)=>`<div class="path-step"><b>第${i+1}步 · ${esc(s.concept)}</b><br>${esc(s.why)}<br><span style="color:#7ee2a8">串联：${esc(s.connect)}</span></div>`).join('')}
    <div class="events">按顺序在左边提问即可，我会陪你一步步学</div></div>`, `攻坚路径：${d.topic}`, '🧭');
}
function renderCreate(d) {
  pushStage(`<div class="card"><h3>✍️ ${esc(d.article.title)}</h3>
    <pre class="article">${esc(d.article.article)}</pre>
    <button class="mini-btn" onclick="navigator.clipboard.writeText(this.parentElement.querySelector('pre').textContent)">📋 复制原稿</button></div>`, d.article.title, '✍️');
}
function renderViz(d) {
  pushStage(`<div class="card"><h3>🎬 ${esc(d.viz.title)}</h3>
    <iframe class="viz" sandbox="allow-scripts" srcdoc="${esc(d.viz.html).replace(/"/g,'&quot;')}"></iframe></div>`, d.viz.title, '🎬');
}

/* ---------- 发送 ---------- */
function collectFiles(fileList) {
  for (const f of fileList) pendingFiles.push(f);
  $('fileChips').innerHTML = pendingFiles.map((f,i)=>`<span class="fchip">${esc(f.name)} <a href="javascript:void(0)" onclick="pendingFiles.splice(${i},1);collectFiles([])">×</a></span>`).join('');
}
$('fileInput').addEventListener('change', e => { collectFiles(e.target.files); e.target.value=''; });
document.body.addEventListener('dragover', e => { e.preventDefault(); $('inputWrap').classList.add('dragover'); });
document.body.addEventListener('dragleave', e => { if (e.target===document.body) $('inputWrap').classList.remove('dragover'); });
document.body.addEventListener('drop', e => { e.preventDefault(); $('inputWrap').classList.remove('dragover'); collectFiles(e.dataTransfer.files); });
$('chatInput').addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); } });

async function send() {
  const text = $('chatInput').value.trim();
  if (!text && !pendingFiles.length) return;
  addMsg('user', text || pendingFiles.map(f=>'📎 '+f.name).join(' '));
  $('chatInput').value = '';
  const form = new FormData();
  form.append('text', text);
  pendingFiles.forEach(f => form.append('files', f));
  pendingFiles = []; $('fileChips').innerHTML = '';
  showStatus('织识思考中…');
  const slowHint = setTimeout(() => showStatus('还在生成，图解/文章类要约 15-30 秒…'), 6000);
  try {
    const d = await (await fetch('/api/chat', {method:'POST', body:form})).json();
    clearTimeout(slowHint);
    showStatus('');
    if (d.error) { addMsg('bot', d.error); return; }
    addMsg('bot', d.reply || '好了。');
    if (d.type==='explain') renderAsk(d);
    else if (d.type==='learn') renderLearn(d);
    else if (d.type==='quiz') pushStage(`<div class="card"><h3>🎯 考考你：${esc(d.concept)}</h3>${quizBlock(d.quiz, d.concept)}</div>`, `考考你：${d.concept}`, '🎯');
    else if (d.type==='mentor') renderMentor(d);
    else if (d.type==='create') renderCreate(d);
    else if (d.type==='visualize') renderViz(d);
    else if (d.type==='save') { updateInboxCount(d.inbox); }
    if (d.highlight && d.highlight.length) { lastHighlight = d.highlight; }
  } catch (e) { clearTimeout(slowHint); showStatus(''); addMsg('bot', '出错了：' + e.message); }
}

$('chatInput').focus();
</script>
</body>
</html>
